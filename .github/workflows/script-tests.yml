name: workflow script tests
"on":
  push:
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Run the tests of the publish workflow scripts
        run: node --test ".github/tests/*.test.mjs"
