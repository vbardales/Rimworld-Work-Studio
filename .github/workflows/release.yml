name: release (approval gated)
"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run is safe. Publish requires steam-production approval.
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'publish' && 'steam-production' || 'release-dry-run' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Rebuild the exact Workshop directory
        run: dotnet build Source/WorkStudio.csproj -c Release --nologo
      - name: Calculate release only (no tag, GitHub release, or Steam upload)
        if: inputs.mode == 'dry-run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run
      # semantic-release-steam neither installs SteamCMD nor places config.vdf: this action does,
      # and exports STEAMCMD_PATH and STEAM_CONFIG_VDF (a path, not the secret) for the plugin.
      # Pinned to a commit because the tag moves on every release and the action receives the session.
      - name: Steam login
        if: inputs.mode == 'publish'
        uses: RimWorks/mod-ci/.github/actions/steam-login@931aff082d97c7746323da89c840e370f7001915 # v1.10
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      - name: Publish after protected-environment approval
        if: inputs.mode == 'publish'
        env:
          STEAM_PUBLISH: 'true'
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
